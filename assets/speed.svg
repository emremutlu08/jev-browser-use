<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" aria-labelledby="title desc" role="img" viewBox="0 0 1200 520"><title id="title">Approximately 5–10 times faster browser operations</title><desc id="desc">Schematic of the approximate speedup reported from EZCollegeApp workflows. Normalized operation time: Codex alone 100, Codex plus Jev 10 to 20. Server processing is excluded; lines illustrate the ratio, not sampled timings.</desc><rect width="1200" height="520" fill="#091725" rx="24"/><g font-family="system-ui, sans-serif"><text x="60" y="70" fill="#fff" font-size="32" font-weight="700">Less time operating. More time building.</text><text x="60" y="106" fill="#a4b6c6" font-size="17">Browser-operation time · normalized comparison</text><path fill="none" stroke="#536475" stroke-width="1.5" d="M100 155V405H865"/><g stroke="#243746"><path d="M100 185H865M100 285H865M100 385H865"/></g><g fill="#a4b6c6" font-size="15"><text x="56" y="190">100</text><text x="66" y="290">50</text><text x="75" y="410">0</text><text x="100" y="439">Start</text><text x="750" y="439">Same workflow</text></g><path fill="none" stroke="#9facc0" stroke-width="4" d="M100 405L850 185"/><path fill="#56edc4" d="M100 405L850 361L850 383Z" opacity=".2"/><path fill="none" stroke="#56edc4" stroke-width="5" d="M100 405L850 372"/><g font-size="17" font-weight="600"><text x="882" y="191" fill="#b9c5d5">Codex alone</text><text x="882" y="378" fill="#56edc4">Codex + Jev</text></g><text x="310" y="252" fill="#56edc4" font-size="62" font-weight="750">~5–10× faster</text><text x="60" y="488" fill="#a4b6c6" font-size="15">EZCollegeApp team experience · schematic · varies by task · excludes server-side processing</text></g></svg>